<!--
 The Emularity: myabandonware.com branded example

 Shows the full MAW setup: the branded splash + spinning logo, the aggregate
 loading bar, boot-straight-into-the-game (no "press any key"), and the
 Start / Stop / Restart / Fullscreen controls.

 Load order: es6-promise.js, browserfs.min.js, loader.js, emularity-controls.js.
 See example_dosbox.html for the engine/game files this needs alongside it.
-->

<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>example maw game</title>
    <link rel="stylesheet" href="emularity-maw.css">
    <style>
      /* Demo layout: centre the emulator, 80vw wide, classic 4:3. */
      #playfield {
        position: relative;          /* splash overlays the canvas; fullscreen target */
        width: 80vw;
        aspect-ratio: 4 / 3;
        margin: 20px auto;
      }
      #canvas {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;  /* crisp scaling for the DOS graphics */
        /* placeholder shown until the game draws over it (before start / after stop) */
        background: #000 url('examples/doom_16.png') no-repeat center center;
        background-size: cover;
      }
      .c-emulator__controls {
        justify-content: center;     /* buttons centred under the emulator */
      }
    </style>
  </head>
  <body>
    <!-- the wrapper is the `c-emulator` block: positioned so the splash overlays
         the canvas, and the target for the Firefox fullscreen fallback -->
    <div id="playfield" class="c-emulator">
      <canvas id="canvas"></canvas>
    </div>

    <div class="c-emulator__controls">
      <button class="c-emulator__control c-emulator__control--start" id="start">Start</button>
      <button class="c-emulator__control c-emulator__control--stop" id="stop">Stop</button>
      <button class="c-emulator__control c-emulator__control--restart" id="restart">Restart</button>
      <button class="c-emulator__control c-emulator__control--fullscreen" id="fullscreen">Fullscreen</button>
      <button class="c-emulator__control c-emulator__control--export" id="export-saves">Export saves</button>
      <button class="c-emulator__control c-emulator__control--import" id="import-saves">Import saves</button>
      <button class="c-emulator__control c-emulator__control--disk" id="export-disk">Download disk</button>
      <button class="c-emulator__control c-emulator__control--reset-game" id="reset-game">Reset game files</button>
      <button class="c-emulator__control c-emulator__control--reset-saves" id="reset-saves">Reset saves</button>
    </div>

    <script type="text/javascript" src="es6-promise.js"></script>
    <script type="text/javascript" src="browserfs.min.js"></script>
    <script type="text/javascript" src="loader.js"></script>
    <script type="text/javascript" src="emularity-controls.js"></script>
    <script type="text/javascript">
      var GAME_ID = "doom-shareware",
          GAME_HASH = "03cc411e6fe56f8a9eb1f95e5c5057c9";
      var controls = new EmulatorControls({
        canvas: "#canvas",
        fullscreenElement: "#playfield",
        splashTitle: "Loading game archive",
        buttons: {
          start: "#start",
          stop: "#stop",
          restart: "#restart",
          fullscreen: "#fullscreen",
          exportSaves: "#export-saves",
          importSaves: "#import-saves",
          exportDisk: "#export-disk",
          resetGame: "#reset-game",
          resetSaves: "#reset-saves"
        },
        // One save store per version of the game: the loader below uses the
        // same id and hash (the md5 of the game zip). A new hash brings the
        // saves over from the old store on the next boot.
        gameId: GAME_ID,
        gameHash: GAME_HASH,
        savesFilename: "doom-saves.zip",
        diskFilename: "doom-disk.zip",
        onSavesMigrated: function (report) {
          console.log("Saves brought over from " + report.from, report);
        },
        // The host builds the loader — this is where V4 injects the download
        // URL (with its token) and the exe to run. Called fresh on every Start.
        createLoader: function () {
          return new DosBoxLoader(DosBoxLoader.saveStore(GAME_ID, GAME_HASH),
                                  DosBoxLoader.emulatorJS("emulators/em-dosbox/dosbox-sync.js"),
                                  DosBoxLoader.locateAdditionalEmulatorJS(locateAdditionalFiles),
                                  DosBoxLoader.nativeResolution(640, 480),
                                  DosBoxLoader.mountZip("c",
                                                        DosBoxLoader.fetchFile("Game File",
                                                                               "examples/DoomV1.9sw1995idSoftwareInc.action.zip")),
                                  DosBoxLoader.startExe("doom.exe"));
        }
      });

      function locateAdditionalFiles(filename) {
        if (filename === "dosbox.html.mem") {
          return "emulators/em-dosbox/dosbox-sync.mem";
        }
        return "emulators/em-dosbox/"+ filename;
      }
    </script>
  </body>
</html>
